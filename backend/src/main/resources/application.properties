spring.application.name=careerpilot

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/careerpilot_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Spring AI - OpenAI
# Set the real key via an environment variable, NEVER commit it to git:
#   Windows (PowerShell):  $env:OPENAI_API_KEY="sk-..."
#   Then run the app from that same terminal.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# Async execution for AI calls (keeps request threads free)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
# JWT signing secret - set via environment variable, never hardcode
jwt.secret=${JWT_SECRET}

# Email (OTP verification) - sent via Brevo's HTTP API, not SMTP.
# Render's free tier (and many hosts) block outbound SMTP ports entirely,
# so an HTTPS-based email API is used instead - see EmailService.java.
brevo.api-key=${BREVO_API_KEY}
app.mail.sender=${MAIL_USERNAME}

