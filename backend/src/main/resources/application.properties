spring.application.name=careerpilot

spring.datasource.url=jdbc:postgresql://localhost:5432/careerpilot_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Spring AI - OpenAI
# Set the real key via an environment variable, NEVER commit it to git:
#   Windows (PowerShell):  $env:OPENAI_API_KEY="sk-..."
#   Then run the app from that same terminal.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# Async execution for AI calls (keeps request threads free)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
# JWT signing secret - set via environment variable, never hardcode
jwt.secret=${JWT_SECRET}

# Email (OTP verification) - uses a Gmail App Password, never your real password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

